# =================================================================
# Remember - 生产环境部署配置
# 适用于 Synology NAS / 群晖 Container Manager (Docker)
# =================================================================

version: '3.8'

services:
  # 后端服务 (Node.js + Prisma + SQLite)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remember-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - API_BASE_URL=${API_BASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-30d}
      - REMEMBER_INITIAL_PASSWORD=${REMEMBER_INITIAL_PASSWORD}
      - DATABASE_URL=file:/app/prisma/data/memories.db
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - ALLOWED_FILE_TYPES=${ALLOWED_FILE_TYPES:-image/jpeg,image/png,image/gif,image/webp}
      - CORS_ORIGIN=${CORS_ORIGIN}
    volumes:
      # 持久化存储 - 映射到 NAS 路径
      - ${REMEMBER_DATA_PATH:-./data}:/app/prisma/data
      - ${REMEMBER_UPLOADS_PATH:-./uploads}:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - remember-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 前端服务 (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE= # 使用相对路径，由 Nginx 代理
    container_name: remember-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - remember-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  remember-network:
    driver: bridge

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/remember-mark.svg" />
    
    <!-- iOS专属：viewport优化 - 遵循Apple最佳实践 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS专属：PWA配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Remember" />
    <link rel="apple-touch-icon" href="/remember-mark.svg" />
    
    <!-- iOS专属：禁用自动检测 -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    
    <!-- 主题颜色 -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    
    <link rel="manifest" href="/manifest.json" />
    <title>Remember — your private memory journal</title>
    <style>
      /* iOS专属：基础优化 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* iOS专属：禁用触摸高亮 */
        -webkit-tap-highlight-color: transparent;
        /* iOS专属：优化文本渲染 */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* iOS专属：禁用触摸回调 */
        -webkit-touch-callout: none;
      }
      body {
        margin: 0 !important;
        padding: 0 !important;
        /* iOS专属：禁用橡皮筋效果 */
        overscroll-behavior-y: none;
      }
      #root {
        margin: 0 !important;
        padding: 0 !important;
      }
      /* iOS专属：优化滚动 */
      * {
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
